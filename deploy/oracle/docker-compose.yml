# Everything the backend needs on one free Oracle Cloud VM.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: perfumeria
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d perfumeria"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  medusa:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/perfumeria
      REDIS_URL: redis://redis:6379
      MEDUSA_WORKER_MODE: shared
      MEDUSA_BACKEND_URL: https://${DOMAIN}
      MEDUSA_FF_TRANSLATION: "true"
    volumes:
      - photos:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Gets a free HTTPS certificate and forwards traffic to Medusa.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to medusa:9000
    volumes:
      - caddydata:/data
    depends_on:
      - medusa

volumes:
  pgdata:
  redisdata:
  photos:
  caddydata:
